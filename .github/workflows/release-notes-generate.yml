name: Release notes - generate

# When a release is published, build its docs-website note and open it as a draft PR for a person to
# edit. A person publishes the release in the GitHub UI, so the release event fires. The event runs
# this file as it is at the tagged commit, so it must be on the default branch before the first
# release that should use it. Run it by hand to rebuild the note for an existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.3.2 (its tag must exist)"
        required: true
      overwrite:
        description: "Replace an existing release-notes branch or file for this version (discards edits on it)"
        type: boolean
        default: false
      dry-run:
        description: "Only build the note into the job summary"
        type: boolean
        default: false

permissions:
  contents: write # POST /releases/generate-notes needs it

jobs:
  generate:
    # Pre-releases are not releases.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    concurrency:
      group: docs-release-notes-next
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0 # tags and history
          persist-credentials: false
          filter: blob:none # the full history is large; commits and tags are enough
      - uses: newrelic/newrelic-android-agent/.github/actions/release-notes/generate@develop
        with:
          version: ${{ inputs.version || github.event.release.tag_name }}
          release-date: published
          overwrite: ${{ inputs.overwrite || false }}
          dry-run: ${{ inputs.dry-run || false }}
          bot-pat: ${{ secrets.BOT_PAT }}
          fork-pat: ${{ secrets.BOT_FORK_PAT }} # the release branch goes to the bot's fork, where the team can edit it
          bot-email: ${{ secrets.BOT_EMAIL }}
          docs-repo: ${{ vars.DOCS_REPO || 'newrelic/docs-website' }}
