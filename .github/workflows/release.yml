name: Release

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android agent version (e.g., 7.7.5)'
        required: false
        type: string
      ios_version:
        description: 'iOS agent version (e.g., 7.7.2)'
        required: false
        type: string
      plugin_version:
        description: 'Plugin version (e.g., 1.2.3)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no publishing)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read

env:
  # net11 mobile targets need the .NET 11 SDK; the plugin/bindings also still target
  # net10, so install both. net11 is pinned to the exact GA SDK so a new feature band
  # can't silently change the iOS/Android workloads (and their Xcode/JDK requirements).
  DOTNET_VERSION_NET10: '10.0.x'
  DOTNET_VERSION_NET11: '11.0.100'

jobs:
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      android_version: ${{ steps.parse.outputs.android_version }}
      ios_version: ${{ steps.parse.outputs.ios_version }}
      plugin_version: ${{ steps.parse.outputs.plugin_version }}
    steps:
      - name: Parse tag or use inputs
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Extract version from tag (e.g., v1.1.16-android7.6.16-ios7.6.3)
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "Parsing tag: $TAG"

            PLUGIN_VERSION=$(echo "$TAG" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            echo "plugin_version=$PLUGIN_VERSION" >> $GITHUB_OUTPUT

            ANDROID_VERSION=$(echo "$TAG" | grep -oE 'android[0-9]+\.[0-9]+\.[0-9]+' | sed 's/android//' || true)
            echo "android_version=$ANDROID_VERSION" >> $GITHUB_OUTPUT

            IOS_VERSION=$(echo "$TAG" | grep -oE 'ios[0-9]+\.[0-9]+\.[0-9]+' | sed 's/ios//' || true)
            echo "ios_version=$IOS_VERSION" >> $GITHUB_OUTPUT
          else
            echo "android_version=${{ inputs.android_version }}" >> $GITHUB_OUTPUT
            echo "ios_version=${{ inputs.ios_version }}" >> $GITHUB_OUTPUT
            echo "plugin_version=${{ inputs.plugin_version }}" >> $GITHUB_OUTPUT
          fi

  release:
    needs: parse-tag
    if: |
      needs.parse-tag.outputs.android_version != '' ||
      needs.parse-tag.outputs.ios_version != '' ||
      needs.parse-tag.outputs.plugin_version != ''
    # Xcode 27 (required by the .NET 11 iOS workload, see below) is only on the xcode-27
    # image, which GitHub still labels preview; macos-latest tops out at Xcode 26.x. Move
    # back to macos-latest once it carries Xcode 27.
    runs-on: xcode-27
    permissions:
      contents: write
      packages: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION_NET10 }}
            ${{ env.DOTNET_VERSION_NET11 }}

      # The .NET 11 GA iOS workload (Microsoft.iOS.Sdk.net11.0_27.2) targets Xcode 27.2.
      # The exact-Xcode check (E0191) only runs for app projects, so these library projects
      # also build net10.0-ios (Microsoft.iOS.Sdk.net10.0_26.0) under the same Xcode. Test
      # apps built against these packages still need the exact matching Xcode.
      - name: Select Xcode 27.2 (matches the .NET 11 iOS workload)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: '27.2'

      # JDK 21 is the only major both Android targets accept: the net10 Android SDK supports
      # JDK 17.0-21.0.99 and the net11 GA Android SDK 21.0-25.0.99. The JDK 21 + CoreCLR
      # agent-startup failure seen on the net11 previews ("Could not determine Java type
      # corresponding to ...") no longer reproduces on GA, in Debug or Release.
      - name: Setup JDK 21 (supported by both the net10 and net11 Android SDKs)
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install workloads
        run: |
          dotnet workload install maui
          dotnet workload install ios
          dotnet workload install android

      # From API 37 Google publishes the base platform as android-37.0 (there is no
      # "platforms;android-37"), and the .NET 11 Android SDK defaults
      # AndroidSdkPlatformVersion to android-37.0.
      - name: Install Android API 37 platform (required by the .NET 11 Android targets)
        run: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"

      - name: Run release script
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANDROID_VERSION: ${{ needs.parse-tag.outputs.android_version }}
          IOS_VERSION: ${{ needs.parse-tag.outputs.ios_version }}
          PLUGIN_VERSION: ${{ needs.parse-tag.outputs.plugin_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.ref_name }}
        run: |
          ARGS=()
          if [ -n "$ANDROID_VERSION" ]; then
            ARGS+=(--android-version "$ANDROID_VERSION")
          else
            ARGS+=(--skip-android)
          fi
          if [ -n "$IOS_VERSION" ]; then
            ARGS+=(--ios-version "$IOS_VERSION")
          else
            ARGS+=(--skip-ios)
          fi
          if [ -n "$PLUGIN_VERSION" ]; then
            ARGS+=(--plugin-version "$PLUGIN_VERSION")
          else
            ARGS+=(--skip-plugin)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--publish)
          fi
          # On a manual dispatch (real run), persist the downloaded agents and
          # version bumps to a release branch (release/<version>) and open a PR
          # into the branch the workflow was started from — branch protection
          # forbids pushing straight to main. Tag-push releases are skipped.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then
            ARGS+=(--commit --push --pr --pr-base "$PR_BASE")
          fi
          echo "Running: scripts/release.sh ${ARGS[*]}"
          bash scripts/release.sh "${ARGS[@]}"

      - name: Upload Android artifact
        if: ${{ needs.parse-tag.outputs.android_version != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-binding-nupkg
          # Both patterns are listed explicitly: *.nupkg does not match
          # *.snupkg, and the symbol package is only on disk for the life of
          # the runner (dotnet nuget push forwards it to nuget.org directly).
          path: |
            NewRelic.MAUI.Android.Binding/bin/Release/*.nupkg
            NewRelic.MAUI.Android.Binding/bin/Release/*.snupkg

      - name: Upload iOS artifact
        if: ${{ needs.parse-tag.outputs.ios_version != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-binding-nupkg
          path: |
            NewRelic.MAUI.iOS.Binding/bin/Release/*.nupkg
            NewRelic.MAUI.iOS.Binding/bin/Release/*.snupkg

      - name: Upload plugin artifact
        if: ${{ needs.parse-tag.outputs.plugin_version != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-nupkg
          path: |
            NewRelic.MAUI.Plugin/bin/Release/*.nupkg
            NewRelic.MAUI.Plugin/bin/Release/*.snupkg

  create-release:
    needs: [parse-tag, release]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.release.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            artifacts/**/*.nupkg
            artifacts/**/*.snupkg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
