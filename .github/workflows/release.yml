name: Release

on:
  workflow_dispatch:
    inputs:
      android_version:
        description: 'Android agent version (e.g., 7.7.5)'
        required: false
        type: string
      ios_version:
        description: 'iOS agent version (e.g., 7.7.2)'
        required: false
        type: string
      plugin_version:
        description: 'Plugin version (e.g., 1.2.3)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (no publishing)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: read

env:
  # net11 mobile targets need the .NET 11 SDK; the plugin/bindings also still target
  # net10, so install both. net11 is pinned to the validated preview for now — bump to
  # the GA SDK when net11 ships (tracked by NR-587402).
  DOTNET_VERSION_NET10: '10.0.x'
  DOTNET_VERSION_NET11: '11.0.100-preview.5.26302.115'

jobs:
  parse-tag:
    runs-on: ubuntu-latest
    outputs:
      android_version: ${{ steps.parse.outputs.android_version }}
      ios_version: ${{ steps.parse.outputs.ios_version }}
      plugin_version: ${{ steps.parse.outputs.plugin_version }}
    steps:
      - name: Parse tag or use inputs
        id: parse
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Extract version from tag (e.g., v1.1.16-android7.6.16-ios7.6.3)
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "Parsing tag: $TAG"

            PLUGIN_VERSION=$(echo "$TAG" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
            echo "plugin_version=$PLUGIN_VERSION" >> $GITHUB_OUTPUT

            ANDROID_VERSION=$(echo "$TAG" | grep -oE 'android[0-9]+\.[0-9]+\.[0-9]+' | sed 's/android//' || true)
            echo "android_version=$ANDROID_VERSION" >> $GITHUB_OUTPUT

            IOS_VERSION=$(echo "$TAG" | grep -oE 'ios[0-9]+\.[0-9]+\.[0-9]+' | sed 's/ios//' || true)
            echo "ios_version=$IOS_VERSION" >> $GITHUB_OUTPUT
          else
            echo "android_version=${{ inputs.android_version }}" >> $GITHUB_OUTPUT
            echo "ios_version=${{ inputs.ios_version }}" >> $GITHUB_OUTPUT
            echo "plugin_version=${{ inputs.plugin_version }}" >> $GITHUB_OUTPUT
          fi

  release:
    needs: parse-tag
    if: |
      needs.parse-tag.outputs.android_version != '' ||
      needs.parse-tag.outputs.ios_version != '' ||
      needs.parse-tag.outputs.plugin_version != ''
    runs-on: macos-latest
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            ${{ env.DOTNET_VERSION_NET10 }}
            ${{ env.DOTNET_VERSION_NET11 }}

      - name: Select Xcode 26.5 (required by the .NET 11 iOS workload; a mismatch is a hard build error)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Setup JDK 21 (required by .NET 11 Android tooling; clears XA0033)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install workloads
        run: |
          dotnet workload install maui
          dotnet workload install ios
          dotnet workload install android

      - name: Install Android API 37 platform (required by the .NET 11 Android targets)
        run: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "platforms;android-37"

      - name: Run release script
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          ANDROID_VERSION: ${{ needs.parse-tag.outputs.android_version }}
          IOS_VERSION: ${{ needs.parse-tag.outputs.ios_version }}
          PLUGIN_VERSION: ${{ needs.parse-tag.outputs.plugin_version }}
          DRY_RUN: ${{ inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          ARGS=()
          if [ -n "$ANDROID_VERSION" ]; then
            ARGS+=(--android-version "$ANDROID_VERSION")
          else
            ARGS+=(--skip-android)
          fi
          if [ -n "$IOS_VERSION" ]; then
            ARGS+=(--ios-version "$IOS_VERSION")
          else
            ARGS+=(--skip-ios)
          fi
          if [ -n "$PLUGIN_VERSION" ]; then
            ARGS+=(--plugin-version "$PLUGIN_VERSION")
          else
            ARGS+=(--skip-plugin)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          else
            ARGS+=(--publish)
          fi
          # On a manual dispatch (real run), persist the downloaded agents and
          # version bumps back to the branch the workflow was started from.
          # Tag-push releases are skipped (no branch to push to).
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" != "true" ]; then
            ARGS+=(--commit --push --branch "$PUSH_BRANCH")
          fi
          echo "Running: scripts/release.sh ${ARGS[*]}"
          bash scripts/release.sh "${ARGS[@]}"

      - name: Upload Android artifact
        if: ${{ needs.parse-tag.outputs.android_version != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-binding-nupkg
          path: NewRelic.MAUI.Android.Binding/bin/Release/*.nupkg

      - name: Upload iOS artifact
        if: ${{ needs.parse-tag.outputs.ios_version != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-binding-nupkg
          path: NewRelic.MAUI.iOS.Binding/bin/Release/*.nupkg

      - name: Upload plugin artifact
        if: ${{ needs.parse-tag.outputs.plugin_version != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-nupkg
          path: NewRelic.MAUI.Plugin/bin/Release/*.nupkg

  create-release:
    needs: [parse-tag, release]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.release.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
